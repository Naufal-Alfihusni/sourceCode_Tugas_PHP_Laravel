<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Penilaian Mahasiswa</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px 16px;
        background: #f1f5f9;
        color: #1e293b;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(100%, 520px);
        margin: 0 auto;
        padding: 28px;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 10px 30px #0f172a14;
      }

      h1 {
        margin-top: 0;
        color: #06a6f0;
        font-size: 1.6rem;
      }

      p {
        line-height: 1.5;
      }

      label {
        display: block;
        margin: 18px 0 7px;
        font-weight: 700;
      }

      input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font: inherit;
      }

      button {
        width: 100%;
        margin-top: 22px;
        padding: 12px;
        border: 0;
        border-radius: 7px;
        background: #0f5076;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #11295e;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Form Penilaian Mahasiswa</h1>
      <p>Masukkan nama, email dan nilai untuk melihat hasil penilaian anda.</p>

      <form method="post" action="app.php">
        <label for="nama">Nama mahasiswa</label>
        <input
          type="text"
          id="nama"
          name="nama"
          maxlength="100"
          placeholder="Ujang"
          required
        />
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Example@gmail.com"
          required
        />
        <label for="nilai">Nilai</label>
        <input
          type="number"
          id="nilai"
          name="nilai"
          min="0"
          max="100"
          step="any"
          placeholder="0-100"
          required
        />

        <button type="submit">Proses Nilai</button>
      </form>
    </main>
  </body>
</html>
